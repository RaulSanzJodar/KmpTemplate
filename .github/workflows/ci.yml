name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Sin secretos: la configuración de Supabase usa los valores de relleno de shared/build.gradle.kts.
      - name: Análisis estático
        run: ./gradlew detekt

      - name: Tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Compilar Android (debug y release con R8)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Validar el código de iOS
        run: ./gradlew :shared:compileIosMainKotlinMetadata

      - name: Publicar informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: shared/build/reports/tests

  # Compila y prueba el target iOS de verdad. Los minutos de macOS son caros: solo a mano
  # (Actions > CI > Run workflow).
  ios:
    name: Tests en simulador iOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de iOS
        run: ./gradlew :shared:iosSimulatorArm64Test
